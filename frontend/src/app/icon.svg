<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#991B1B"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#1C1917" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App Squircle Badge -->
  <rect width="64" height="64" rx="16" fill="url(#shieldBg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#goldAccent)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Maasai Shuka Accent Ribbon at Top -->
  <rect x="20" y="7" width="7" height="2" rx="1" fill="#F59E0B"/>
  <rect x="29" y="7" width="6" height="2" rx="1" fill="#1C1917"/>
  <rect x="37" y="7" width="7" height="2" rx="1" fill="#F59E0B"/>

  <!-- Protective Maasai Shield Silhouette -->
  <path d="M 32 13 C 43 21, 45 36, 32 50 C 19 36, 21 21, 32 13 Z" fill="#1C1917" fill-opacity="0.3"/>
  <path d="M 32 13 C 43 21, 45 36, 32 50 C 19 36, 21 21, 32 13 Z" stroke="url(#goldAccent)" stroke-width="2" stroke-linecap="round"/>

  <!-- Bold Serif 'K' for Kinga Binti -->
  <text x="32" y="39" text-anchor="middle" font-size="26" font-weight="800" font-family="'Fraunces', Georgia, serif" fill="#FAF7F2" filter="url(#softGlow)">K</text>

  <!-- Golden Anchor Dot -->
  <circle cx="32" cy="45" r="2" fill="url(#goldAccent)"/>
</svg>
